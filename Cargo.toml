[package]
name = "goto"
version = "0.3.0"
edition = "2024"
description = "Jump to any git repo under your source root by its directory name."
license = "MIT"
repository = "https://github.com/RiceKrisBs/goto"

[[bin]]
name = "gt-bin"
path = "src/main.rs"

[dependencies]
ignore = "0.4"

[profile.release]
opt-level = 3
lto = true
