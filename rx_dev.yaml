up:
  - homebrew:
      - name: fzf
  - script:
      title: Install the Rust toolchain
      satisfied?: ./rx_scripts/rust.sh --satisfied
      satisfy: ./rx_scripts/rust.sh --satisfy
  - script:
      title: Build and install gt-bin
      satisfied?: ./rx_scripts/build.sh --satisfied
      satisfy: ./rx_scripts/build.sh --satisfy
  - script:
      title: Install the gt shell function to ~/.goto.zsh
      satisfied?: ./rx_scripts/shell-fn.sh --satisfied
      satisfy: ./rx_scripts/shell-fn.sh --satisfy
  - script:
      title: Remind the user to source ~/.goto.zsh
      satisfied?: ./rx_scripts/remind.sh --satisfied
      satisfy: ./rx_scripts/remind.sh --satisfy
